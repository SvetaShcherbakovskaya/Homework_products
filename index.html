<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Список продуктов</title>

  <style>
    .bought {
      text-decoration: line-through;
      color: gray;
    }

    li {
      cursor: pointer;
      margin: 5px 0;
    }
  </style>

  <script src="./Homework.js" defer></script>
</head>

<body>

  <h1>Список продуктов</h1>

  <input
    id="productInput"
    type="text"
    placeholder="Название"
  >

  <input
    id="categoryInput"
    type="text"
    placeholder="Категория"
  >

  <button id="addButton">
    Добавить
  </button>

  <hr>

  <button id="allButton">Все</button>
  <button id="needButton">Нужно купить</button>
  <button id="boughtButton">Куплено</button>

  <hr>

  <button id="createDraftButton">
    Создать черновик
  </button>

  <button id="saveDraftButton">
    Сохранить изменения
  </button>

  <button id="cancelDraftButton">
    Отменить изменения
  </button>

  <h2>Продукты:</h2>

  <ul id="productList"></ul>

</body>
</html>
